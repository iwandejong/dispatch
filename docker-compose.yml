services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dispatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatch"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [internal]
    # No `ports:` — reachable only from other containers on this network.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dispatch:${POSTGRES_PASSWORD}@postgres:5432/dispatch
    # No authentication: publish on localhost only. Put an authenticating proxy in front to expose it.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
    networks: [internal]

  # Dev/test toolbox: `docker compose --profile dev run --rm --service-ports dev <cmd>`
  dev:
    profiles: [dev]
    image: node:22-bookworm
    working_dir: /work
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dispatch:${POSTGRES_PASSWORD}@postgres:5432/dispatch
      TEST_DATABASE_URL: postgresql://dispatch:${POSTGRES_PASSWORD}@postgres:5432/dispatch_test
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/work
      - node_modules:/work/node_modules
      - next_cache:/work/.next
    ports:
      - "127.0.0.1:3000:3000"
    networks: [internal]

networks:
  internal: {}

volumes:
  pgdata:
  node_modules:
  next_cache:
